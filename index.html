<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> AuroraOS | Guilherme França </title>
    <link rel="icon" href="./favicon.ico" sizes="any">
    <link rel="stylesheet" href="./css/main.css">
</head>

<body>
    <!-- Camada visual que simula as linhas de um monitor CRT. -->
    <div id="crt-overlay" aria-hidden="true"></div>

    <!-- Containers preenchidos pelos componentes JavaScript. -->
    <section id="boot-container"></section>
    <section id="session-container"></section>

    <!-- Interface principal do sistema. -->
    <nav id="taskbar" class="interface-window no-select" aria-label="Barra de tarefas"></nav>
    <main id="desktop" aria-label="Área de trabalho"></main>

    <script type="module" src="./js/main.js" defer></script>
</body>

</html>
