<section id="taskbar-calendar-container" class="interface-window" style="display: none;">
    <!-- Calendar tiblebar  -->
    <article id="titlebar-calendar" class="interface-title-bar">
        <p id="month-year"></p>
        <button type="button" id="calendar-button-up" class="calendar-interface-button interface-button" aria-label="Mês anterior"> ▲ </button>
        <button type="button" id="calendar-button-down" class="calendar-interface-button interface-button" aria-label="Próximo mês"> ▼ </button>
    </article>

    <!-- Days and days of the week container -->
    <article id="container-dates" class="interface-field"></article>
</section>
