<section class="doom-app" aria-label="Emulador do DOOM">
    <div class="doom-player" data-doom-player aria-label="Área do jogo"></div>

    <section class="doom-loading" data-doom-status role="status" aria-live="polite">
        <img src="./assets/DOOM.png" alt="DOOM" class="doom-loading-icon">
        <p class="doom-loading-title">Preparando o DOOM...</p>
        <p class="doom-loading-message" data-doom-status-message>
            O emulador e o jogo serão carregados somente agora.
        </p>
        <progress class="doom-loading-progress" aria-label="Carregando DOOM"></progress>
    </section>
</section>
