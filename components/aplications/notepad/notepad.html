<section class="notepad-app" aria-label="Bloco de notas">
    <main class="notepad-main interface-main-content">
        <label class="notepad-label" for="notepad-editor">Anotações</label>
        <textarea id="notepad-editor" class="notepad-editor interface-input" spellcheck="true" placeholder="Digite suas anotações aqui..."></textarea>
    </main>

    <footer class="notepad-footer interface-footer-content">
        <section class="notepad-status" aria-live="polite">
            <span id="notepad-word-count">0 palavras</span>

            <span class="interface-divider" aria-hidden="true"></span>
            
            <span id="notepad-character-count">0 caracteres</span>
            
            <span id="notepad-save-status">Nenhuma alteração</span>
        </section>

        <button id="notepad-save-button" type="button" class="interface-button interface-window-button">
            <p>Salvar</p>
        </button>
    </footer>
</section>
